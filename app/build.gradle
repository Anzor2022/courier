plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.mahnet.courier'
    compileSdk 34

    // Версия: номер сборки на GitHub увеличивается сам при каждом запуске,
    // поэтому каждая новая сборка устанавливается ПОВЕРХ старой как обновление.
    def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

    defaultConfig {
        applicationId "ru.mahnet.courier"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    // Постоянная подпись: один и тот же ключ для всех сборок (иначе Android не даёт обновить поверх).
    signingConfigs {
        market {
            storeFile file("market-release.p12")
            storeType "pkcs12"
            storePassword "market-courier-2026"
            keyAlias "market"
            keyPassword "market-courier-2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.market
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.market
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
